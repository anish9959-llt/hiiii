<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      height: 100vh;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Cursive', sans-serif;
      position: relative;
    }

    .bg-heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.6);
      user-select: none;
      animation: floatUp linear infinite;
      cursor: pointer;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    .love-card {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 18px;
      border-radius: 25px;
      box-shadow: 0 8px 15px rgba(255, 105, 180, 0.3);
      color: #ff3366;
      font-weight: bold;
      font-size: 1.1rem;
      backdrop-filter: blur(4px);
      border: 2px solid #ffb6c1;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 pulse 1.5s ease-in-out infinite alternate;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .love-card:hover {
      transform: scale(1.2) !important;
      background: #fff;
      z-index: 9999 !important;
    }

    @keyframes popIn {
      0% {
        transform: scale(0) rotate(-10deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .photo-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10000;
    }

    .photo-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .photo-container {
      position: relative;
      max-width: 85vw;
      max-height: 80vh;
      background: #fff;
      padding: 12px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transform: scale(0.7);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .photo-modal.active .photo-container {
      transform: scale(1);
    }

    .photo-container img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      display: block;
      object-fit: contain;
    }

    .close-btn {
      position: absolute;
      top: -15px;
      right: -15px;
      background: #ff3366;
      color: white;
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="photo-modal" id="photoModal" onclick="closePhoto()">
    <div class="photo-container" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closePhoto()">✕</button>
      <img id="popupImage" src="" alt="Love Photo">
    </div>
  </div>

  <script>
    const photos = [
      "photo/20260604_152532.jpg",
      "photo/20260604_152539.jpg",
      "photo/20260604_165649.jpg",
      "photo/20260604_165830.jpg"
    ];

    const messages = [
      "I love you! 💕",
      "I love you so much! ✨",
      "Forever & Always ❤️",
      "You are loved! 💖",
      "I love you! 🌸",
      "I love you! 🧸",
      "I love you bunches! 💗",
      "I love you! 🍬"
    ];

    function openPhoto() {
      const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
      document.getElementById('popupImage').src = randomPhoto;
      document.getElementById('photoModal').classList.add('active');
    }

    function closePhoto() {
      document.getElementById('photoModal').classList.remove('remove');
      document.getElementById('photoModal').classList.remove('active');
    }

    function createBgHeart() {
      const heart = document.createElement('div');
      heart.classList.add('bg-heart');
      heart.innerText = ['❤️', '💖', '✨', '🌸', '💕'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
      heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
      heart.addEventListener('click', openPhoto);
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 7000);
    }

    function spawnLoveCard() {
      const card = document.createElement('div');
      card.classList.add('love-card');
      card.innerText = messages[Math.floor(Math.random() * messages.length)];
      
      const x = Math.random() * (window.innerWidth - 180);
      const y = Math.random() * (window.innerHeight - 60);
      
      card.style.left = `${x}px`;
      card.style.top = `${y}px`;
      
      const rotation = (Math.random() * 30) - 15;
      card.style.transform = `rotate(${rotation}deg)`;

      card.addEventListener('click', openPhoto);
      document.body.appendChild(card);
    }

    setInterval(createBgHeart, 300);

    let count = 0;
    const interval = setInterval(() => {
      spawnLoveCard();
      count++;
      if (count > 35) clearInterval(interval);
    }, 200);
  </script>
</body>
</html>
